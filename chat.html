<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>问政策 · 政策通（湖南）</title>
<meta name="description" content="把问题换成带条款引用的答案。" />
<meta name="theme-color" content="#123c69" />
<link rel="stylesheet" href="assets/style.css" />

</head>
<body data-page="chat">
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="index.html">
      <span class="mark">湘</span>
      <span>
        <span class="name" style="display:block">政策通 · 湖南</span>
        <span class="tagline">小微企业政策助手</span>
      </span>
    </a>
    <nav class="nav"><a href="index.html">首页</a><a href="policies.html">政策库</a><a href="chat.html" aria-current="page">智能问答</a><a href="plan.html">路径规划</a></nav>
    <div class="header-cta">
      <span class="hint">参赛演示版</span>
      <a class="btn btn-primary" href="chat.html">问一个政策问题</a>
    </div>
  </div>
</header>
<main class="wrap">
<div class="chat-shell">
  <div class="chat-head">
    <p class="kicker plain">ASK</p>
    <h1>问政策</h1>
    <p>用大白话问，答案只从政策库里的条款生成，并标出处。答不上来的问题会直说，不会编。</p>
  </div>

  <div class="chat-log" id="log">
    <div class="presets" id="presets">
      <p>你可以这样问：</p>
      <div class="list">
        <button type="button" class="preset" data-q="我刚在长沙注册的小公司，企业所得税要交多少？">我刚在长沙注册的小公司，企业所得税要交多少？</button>
<button type="button" class="preset" data-q="小规模纳税人月销售额多少可以免增值税？">小规模纳税人月销售额多少可以免增值税？</button>
<button type="button" class="preset" data-q="研发费用加计扣除需要准备哪些材料？">研发费用加计扣除需要准备哪些材料？</button>
<button type="button" class="preset" data-q="创业担保贷款怎么申请，能贴息多少？">创业担保贷款怎么申请，能贴息多少？</button>
      </div>
    </div>
    <div class="chat-note">
      本页是离线演示版：问答由浏览器内的条款检索引擎完成，没有网络、没有服务端也能给出原文摘录 + 出处。
      湖南本地政策尚未导入，目前只能依据全国层面条款作答——导入办法见「开发者模式」。
    </div>
    <div id="log-end"></div>
  </div>

  <form class="chat-form" id="ask-form">
    <textarea id="question" rows="1" placeholder="描述企业情况，例如：长沙、20 人、营收 400 万"></textarea>
    <button type="submit" class="btn btn-primary">提问</button>
  </form>
  <p class="chat-foot">回答依据已收录政策生成，办理前请以主管部门最新口径为准。</p>
</div>
</main>
